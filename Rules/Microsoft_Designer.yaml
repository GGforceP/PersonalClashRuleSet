payload:
  # Microsoft Designer 主站及其子域
  - "+.designer.microsoft.com"

  # Microsoft Designer 静态资源 / CDN
  - "+.designerapp.osi.office.net"

  # Microsoft Designer Web 应用 / 图片、文档、媒体、RTC 等资源
  - "+.designerapp.officeapps.live.com"

  # Microsoft Designer EDOG / 预发布应用域
  - "+.designerapp.edog.officeapps.live.com"

  # Microsoft Designer 服务资源 / 授权资源标识
  - "+.designerappservice.officeapps.live.com"

  # Microsoft 365 内嵌的 Designer 页面
  - "+.designer.svc.cloud.microsoft"

  # Microsoft Designer 认证资源（精确域名，避免扩大 Microsoft 登录流量范围）
  - "aadcdn.msftauth.net"

  # Microsoft Designer 使用的 Microsoft OneCDN 精确资源域名
  - "res.public.onecdn.static.microsoft"
  - "createcatalog.public.onecdn.static.microsoft"

  # Microsoft Designer / Office 配置服务（精确域名）
  - "ecs.office.com"
