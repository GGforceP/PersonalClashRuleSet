# ============================================================
# PersonalClashRuleSet - 完整 Mihomo 配置
# ============================================================
# 说明：
# 1. 本文件的 proxy-groups / rule-providers / rules 与 rules.yaml 保持一致。
# 2. 使用前请将 SUBSCRIPTION_URL 替换为真实订阅地址。
# 3. OpenClash 可能根据插件设置覆写端口、DNS、Sniffer、TUN 等字段。
# 4. Smart 内核专属配置单独维护在 rules_smart.yaml；基础分流变更需与 rules.yaml 同步。

# -------------------- 基础配置 --------------------
mixed-port: 7890
allow-lan: true
bind-address: "*"
mode: rule
log-level: info
ipv6: true

# 路由器环境关闭进程匹配可减少额外开销
find-process-mode: off

# 统一延迟与 TCP 并发
unified-delay: true
tcp-concurrent: true

# Mihomo API；如需允许局域网访问 Dashboard，请同时做好访问控制
external-controller: 127.0.0.1:9090
secret: ""

# -------------------- 缓存 --------------------
profile:
  store-selected: true
  store-fake-ip: true

# -------------------- GEO 数据 --------------------
# 当前规则使用 GEOSITE / GEOIP dat 分类，因此启用 geodata-mode
geodata-mode: true
geodata-loader: memconservative
geo-auto-update: true
geo-update-interval: 24
geox-url:
  geoip: "https://testingcf.jsdelivr.net/gh/Loyalsoldier/v2ray-rules-dat@release/geoip.dat"
  geosite: "https://testingcf.jsdelivr.net/gh/Loyalsoldier/v2ray-rules-dat@release/geosite.dat"
  mmdb: "https://testingcf.jsdelivr.net/gh/alecthw/mmdb_china_ip_list@release/Country.mmdb"
  asn: "https://testingcf.jsdelivr.net/gh/xishang0128/geoip@release/GeoLite2-ASN.mmdb"

# -------------------- 订阅节点 --------------------
proxy-providers:
  subscription:
    type: http
    url: "SUBSCRIPTION_URL"  # 必填：替换为实际订阅链接
    path: ./proxy_providers/subscription.yaml
    interval: 86400
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
      timeout: 5000
      lazy: true
      expected-status: 204

# -------------------- DNS --------------------
# Fake-IP 模式下不配置 fallback：代理域名尽量交由代理链路解析；
# nameserver 主要承担直连类域名解析，proxy-server-nameserver 用于解析代理节点域名。
dns:
  enable: true
  listen: 0.0.0.0:7874
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "*.lan"
    - "+.local"
  use-hosts: true
  respect-rules: true
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query

# -------------------- 域名嗅探 --------------------
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: false
  sniff:
    HTTP:
      ports: [80, 8080-8880]
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  force-domain:
    - +.netflix.com
    - +.nflxvideo.net
    - +.amazonaws.com
    - +.media.dssott.com
  skip-domain:
    - Mijia Cloud
    - dlg.io.mi.com
    - +.oray.com
    - +.sunlogin.net
    - +.push.apple.com

# -------------------- TUN --------------------
# 默认关闭，避免与 OpenClash 的透明代理模式重复接管；
# 独立运行 Mihomo 且需要 TUN 时再将 enable 改为 true。
tun:
  enable: false
  stack: mixed
  dns-hijack:
    - any:53
    - tcp://any:53
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true

